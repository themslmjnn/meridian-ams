[project]
name = "meridian-ams"
version = "0.1.0"
description = "Meridian Academics Management System"
readme = "README.md"
authors = [
    { name = "Munavarov Muslimjon", email = "mnvrv.mm@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 88
 
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments (FastAPI Depends pattern)
]
 
[tool.ruff.lint.isort]
known-first-party = ["src"]
 
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
 
[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "passlib.*",
    "slowapi.*",
    "prometheus_fastapi_instrumentator.*",
]
ignore_missing_imports = true
