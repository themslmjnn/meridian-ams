[project]
name = "meridian-ams"
version = "0.1.0"
description = "Meridian AMS"
readme = "README.md"
authors = [
    { name = "Muslimjon", email = "mnvrv.mm@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "greenlet>=3.5.6",
    "phonenumbers>=9.0.42",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.8.4",
    "ruff>=0.17.3",
]
