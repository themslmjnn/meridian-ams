[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --strict-config
env =
    ENVIRONMENT=test
markers =
    db_constraint: test bypasses the service layer to verify a database-level
        constraint (e.g. a partial unique index) directly.
